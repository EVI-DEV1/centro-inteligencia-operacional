name: Conferência

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do OPS (núcleo, demonstração, API e webhooks)
        run: npm test
      - name: Arquivo único
        run: node scripts/build.mjs
